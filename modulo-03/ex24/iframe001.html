<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estududos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de iframe</h1>
    <P>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0" scolling="no"> 
            <a href="https:www.cursoemvideo.com" target="_blank"></a>
        </iframe>
        
        para aprender a programa.</P>

        <P>O repositorio do Guanabara
            <iframe src="https://gustavoguanabara.github.io" frameborder="0"> no
                <a href="https://gustavoguanabara.github.io" target="_blank">Github</a>
            </iframe>
            
            também é bem legal!</P>
    
</body>
</html>
